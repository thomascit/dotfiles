# The packaged defaults are loaded first (RANGER_LOAD_DEFAULT_RC=true). Keep
# this file small so ranger's built-in Vim motions and file operations survive.
set colorscheme dracula
set column_ratios 2,3,4

# Use icons when installed; keep config-only installs on the default linemode.
eval -q fm.execute_console('default_linemode devicons2') if 'devicons2' in ranger.container.fsobject.FileSystemObject.linemode_dict else None

# Vim/netrw-style navigation (both keys are unbound in ranger's defaults).
map <C-o> history_go -1
map - cd ..

# Plugin shortcuts; leave default f and / unchanged. zf replaces ranger's
# built-in `filter` binding, which stays available as :filter.
map zf console fzf_filter%space
map cz console z%space
map cZ zi
map ex console extract%space
map ec console compress%space
