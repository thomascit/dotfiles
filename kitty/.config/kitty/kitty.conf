font_size 14
font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
background_opacity 0.8
background_blur 1
hide_window_decorations yes
# Option sends Alt on macOS, matching Ghostty, so tmux's M-h / M-l work.
macos_option_as_alt yes


# BEGIN_KITTY_THEME
# Dracula
include current-theme.conf
# END_KITTY_THEME
