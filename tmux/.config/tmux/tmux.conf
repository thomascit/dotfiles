# Options to make tmux more pleasant
set -g default-shell $SHELL
set -g base-index 1
set -g mouse on
set -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -g set-clipboard on
set -g detach-on-destroy off
set -g pane-border-lines heavy

# Options adopted from tmux-sensible, set here instead of via the plugin so this
# config behaves the same with or without TPM (a `setup.sh --minimal` server has
# no TPM, because fetching plugins needs network). Values match the plugin's.
# tmux defaults are noted so the reason each line exists stays obvious.
# status-interval is set in the fallback theme section further down, and
# default-terminal is probed by the if-shell below — better than sensible's
# unconditional screen-256color — so neither is repeated here.
set -s escape-time 0            # server option. Default 500ms = ESC lag in vim
set -g history-limit 50000      # default 2000
set -g display-time 4000        # default 750ms; status messages flash by
set -g status-keys emacs        # tmux infers vi from $EDITOR; emacs at prefix + :
set -g focus-events on          # default off; vim autoread / focus autocmds
setw -g aggressive-resize on    # default off; grouped sessions, multi-client

# Auto-named sessions start at 1, matching base-index / pane-base-index above.
# tmux has no session-level base-index — an unnamed `new-session` is always
# named 0 first — so the script renames it after the fact. -b is required; see
# the comment block in the script for why.
set-hook -g session-created \
  "run-shell -b '~/.config/tmux/scripts/session-renumber.sh #{hook_session_name}'"

# Move tmux to top
set-option -g status-position top

# Terminal and color support
# tmux-256color lives in the ncurses-term package, which is not installed on
# minimal Debian/Ubuntu images. Without the terminfo entry tmux refuses to
# start at all, so fall back to screen-256color when it is unavailable.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# Enable truecolor for common TERM values, including nested tmux over SSH
set -ga terminal-overrides ",*256col*:Tc,tmux-256color:Tc,screen-256color:Tc"

# Set vi mode keys
setw -g mode-keys vi

# List of plugins
# Everything here is additive: the config works standalone without TPM. Only the
# dracula theme, resurrect's save/restore and yank's prefix + y/Y are lost.
# tmux-sensible is deliberately absent — its options are set above, and its only
# other bindings (C-p/C-n) duplicate M-h/M-l.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect options
set -g @resurrect-save 'M-s'
set -g @resurrect-restore 'M-r'

# Continuum options
#set -g @continuum-boot 'on'
#set -g @continuum-restore 'on'

# Dracula Config
set -g @dracula-show-left-icon '#S | #H'
set -g @dracula-plugins 'cpu-usage ram-usage uptime ssh-session'
set -g @dracula-cpu-usage-label ''
set -g @dracula-ram-usage-label ''
set -g @dracula-uptime-label ''
set -g @dracula-cpu-usage-colors 'green dark_gray'
set -g @dracula-ram-usage-colors 'green dark_gray'
set -g @dracula-uptime-colors 'green dark_gray'
set -g @dracula-ssh-session-colors 'red dark_gray'
set -g @dracula-show-empty-plugins false
set -g @dracula-show-ssh-only-when-connected true
set -g @dracula-border-contrast true
set -g @dracula-left-pad ''
set -g @dracula-right-pad ''

# Vim Navigator Key Bindings
set -g @vim_navigator_mapping_left 'C-h'
set -g @vim_navigator_mapping_right 'C-l'
set -g @vim_navigator_mapping_up 'C-k'
set -g @vim_navigator_mapping_down 'C-j'
set -g @vim_navigator_mapping_prev 'C-\\'

# Custom Key Bindings
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Popups
# s  — Session picker: fzf over the running sessions.
# C-x kills the highlighted session and reloads the list. Overrides tmux's
# default `s` (choose-tree -Zs), still available as `prefix + :` then
# `choose-tree -Zs`.
#
# Formats use the brace-free tmux alias (#S) rather than
# #{session_name}, because these strings pass through fzf's --bind
# actions where "{...}" is fzf's own placeholder syntax. They must still be
# quoted: an unquoted "#" would start a shell comment.
#
# CRITICAL: every "#" is doubled. run-shell expands tmux formats in its argument
# BEFORE handing it to sh — that is what makes `run-shell "echo #{pane_current_path}"`
# work. So a literal "#S" here is replaced with the *calling* session's name, and
# `list-sessions -F "#S"` degrades into `-F "dotfiles"`: a constant, printed once
# per session, so N sessions show the same name N times. "##" is the format
# escape for a literal "#", leaving "#S" for tmux's own list-sessions to expand
# per row. Verify with:
#   tmux run-shell -b 'tmux list-sessions -F "##S" > /tmp/t'; cat /tmp/t
# Inner quotes are escaped as \" — tmux performs no replacements inside single
# quotes, so the backslashes reach the shell intact. Single quotes also mean $
# is left for the shell.
bind s run-shell ' \
    picked=$(tmux list-sessions -F "##S" \
        | fzf-tmux -p 60%,50% \
            --no-sort \
            --border-label " sessions " \
            --prompt "session > " \
            --header "enter: switch  C-x: kill  esc: cancel" \
            --bind "ctrl-x:execute-silent(tmux kill-session -t ={})+reload(tmux list-sessions -F \"##S\")") || exit 0; \
    [ -n "$picked" ] || exit 0; \
    tmux switch-client -t "=$picked"'

# Remove the old project picker even when reloading into an existing server.
unbind P

# S  — SSH picker
bind S run-shell ' \
    host=$(grep -E "^Host " ~/.ssh/config | awk "{print \$2}" | grep -v "^\*$" \
        | fzf-tmux -p 60%,50% \
            --no-sort \
            --border-label " ssh hosts " \
            --prompt "ssh > " \
            --header "enter: connect  esc: cancel") || exit 0; \
    [ -n "$host" ] || exit 0; \
    tmux new-window "ssh $host"'

# w  — window switcher
bind w run-shell ' \
    picked=$(tmux list-windows -F "##I: ##W (##{pane_current_command})" \
        | fzf-tmux -p 60%,50% \
            --no-sort \
            --border-label " windows " \
            --prompt "window > " \
            --header "enter: switch  esc: cancel") || exit 0; \
    [ -n "$picked" ] || exit 0; \
    tmux select-window -t ":${picked%%:*}"'

# O  — OpenCode (continue last session)
bind O new-window -c "#{pane_current_path}" 'opencode'

# C-o  — tmux's default (rotate-window: cycle pane contents around the layout).
# Restating the default means reloading into an existing server drops the old
# project-picker binding that used this key.
bind C-o rotate-window

# r  — run command (auto-closes on success, stays open on error)
bind r command-prompt -p "Run:" \
    "new-window -c '#{pane_current_path}' 'zsh -ic \"%%\"; ret=\$?; [ \$ret -ne 0 ] && { echo \"[Exit: \$ret] Press Enter...\"; read; }'"

# N  — $EDITOR in current path
bind N new-window -c "#{pane_current_path}" '${EDITOR:-vim}'

# Remove the duplicate editor shortcut on reload as well as on fresh servers.
unbind V

# ?  — key bindings reference (fzf popup)
bind ? display-popup -E -B -w 60% -h 75% \
    "printf '%b\\n' \
    '' \
    '\\033[1;35m 󰋼  Popups\\033[0m' \
    '    \\033[36mprefix + s\\033[0m       Session picker (fzf)' \
    '    \\033[36mprefix + S\\033[0m       SSH host picker' \
    '    \\033[36mprefix + r\\033[0m       Run command' \
    '    \\033[36mprefix + C\\033[0m       Config file picker' \
    '    \\033[36mprefix + R\\033[0m       Reload tmux.conf' \
    '    \\033[36mprefix + ?\\033[0m       This help' \
    '' \
    '\\033[1;35m 󰖲  New Windows\\033[0m' \
    '    \\033[36mprefix + O\\033[0m       OpenCode' \
    '    \\033[36mprefix + N\\033[0m     Editor (current path)' \
    '    \\033[36mprefix + f\\033[0m       Ranger file manager' \
    '    \\033[36mprefix + g\\033[0m       Lazygit' \
    '    \\033[36mprefix + p\\033[0m       btop' \
    '    \\033[36mprefix + a\\033[0m       cmatrix' \
    '    \\033[36mprefix + c\\033[0m       New window (current path)' \
    '' \
    '\\033[1;35m 󰯌  Pane Splits\\033[0m' \
    '    \\033[36mprefix + -\\033[0m       Horizontal split' \
    '    \\033[36mprefix + _\\033[0m       Vertical split' \
    '    \\033[36mprefix + v\\033[0m       Vertical split left (editor 60%%)' \
    '    \\033[36mprefix + o\\033[0m       Vertical split 40%% (OpenCode Continue)' \
    '    \\033[36mprefix + t\\033[0m       Horizontal split 25%%' \
    '' \
    '\\033[1;35m 󰁍  Pane Navigation\\033[0m' \
    '    \\033[36mC-h/j/k/l\\033[0m        Move between panes (vim-style)' \
    '    \\033[36mC-\\\\\\033[0m              Previous pane' \
    '    \\033[36mprefix + H/J/K/L\\033[0m Resize pane' \
    '' \
    '\\033[1;35m   Windows\\033[0m' \
     '    \\033[36mprefix + w\\033[0m       Window switcher (fzf)' \
     '    \\033[36mprefix + ,\\033[0m       Rename window' \
    '    \\033[36mM-h / M-l\\033[0m        Prev / next window' \
    '    \\033[36mS-Left/Right\\033[0m     Swap window left / right' \
    '' \
    '\\033[1;35m 󰔡  Toggles\\033[0m' \
    '    \\033[36mprefix + b\\033[0m       Toggle status bar' \
    '    \\033[36mprefix + B\\033[0m       Toggle pane border status' \
    '    \\033[36mprefix + T\\033[0m       Toggle status position' \
    '' \
    '\\033[1;35m 󰅖  Kill\\033[0m' \
    '    \\033[36mprefix + x\\033[0m       Kill pane' \
    '    \\033[36mprefix + &\\033[0m       Kill window' \
    '' \
    '\\033[1;35m 󰆏  Copy Mode (vi)\\033[0m' \
    '    \\033[36mprefix + Space\\033[0m   Enter copy mode' \
    '    \\033[36mv\\033[0m                Begin selection' \
    '    \\033[36my\\033[0m                Yank' \
    '    \\033[36mr\\033[0m                Rectangle toggle' \
    '' \
    '\\033[1;35m 󰁯  Resurrect \\033[0;35m(needs TPM)\\033[0m' \
    '    \\033[36mprefix + M-s\\033[0m     Save session' \
    '    \\033[36mprefix + M-r\\033[0m     Restore session' \
    '' \
  | fzf --no-sort --ansi --border=rounded --border-label=' key bindings ' \
    --layout=reverse-list --prompt='search > ' --header='prefix = C-Space  │  esc: cancel' \
    --bind 'tab:down,btab:up' --height=100%"

# C  — fzf ~/.config file picker → open in $EDITOR
unbind C-c
bind C run-shell ' \
    file=$(rg --files --hidden -L ~/.config/ \
        | fzf-tmux -p 60%,50% \
            --no-sort \
            --with-nth=-1 --delimiter=/ \
            --border-label " config files " \
            --prompt "config > " \
            --header "enter: edit  esc: cancel") || exit 0; \
    [ -n "$file" ] || exit 0; \
    tmux new-window "${EDITOR:-vim} $file"'

# R  — reload this config
# `prefix + R` is NOT a tmux default (the only uppercase keys tmux binds are D, L
# and M). The familiar binding comes from tmux-sensible, which this config no
# longer uses, so it is bound here instead — that way reload works with or
# without TPM. tmux 3.2+ could use `source-file -F '#{config_files}'`; the
# literal path matches the rest of this file and works on older tmux too.
bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Split panes and new windows in current path
bind c new-window -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
bind v split-window -hb -l 60% -c "#{pane_current_path}" '${EDITOR:-vim}'
bind o split-window -h -l 40% -c "#{pane_current_path}" "opencode --continue"
bind t split-window -v -l 25% -c "#{pane_current_path}"
bind m split-window -v -l 10% -c "#{pane_current_path}"
bind f new-window -n ranger 'ranger'
bind g new-window 'lazygit'
bind p new-window 'btop'
bind a new-window 'cmatrix -s'

# Keep automatic naming by default; an explicit name pins only that window.
bind ',' command-prompt -I '#W' -p 'Window name:' { rename-window '%%' }

# Drop old custom rename keys and the session rename key on config reload.
unbind C-w
unbind C-s
unbind '$'

# Toggle status bar visibility
bind b set -g status

# Toggle pane border status
bind B set -g pane-border-status

# Toggle status bar position between top and bottom
bind T if-shell 'tmux show-option -gv status-position | grep -q top' \
    'set-option -g status-position bottom' \
    'set-option -g status-position top'

# Pane border format
set -g pane-border-format "[#{pane_current_command}]"

# Popup border color (Dracula comment/dark_purple)
set -g popup-border-style "fg=#6272a4"


# Kill pane/window without confirmation
bind x kill-pane
bind & kill-window

# Resize panes with HJKL under prefix
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode
bind Space copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Move windows left/right
bind -n S-Left swap-window -t -1 \; select-window -t -1
bind -n S-Right swap-window -t +1 \; select-window -t +1

# Navigate to previous/next window
bind -n M-l next-window
bind -n M-h previous-window

# ─────────────────────────────────────────────────────────────────────────────
# Fallback theme and pane navigation (used when TPM is not installed)
# ─────────────────────────────────────────────────────────────────────────────
# A server installed with `setup.sh --minimal` has no TPM, because fetching
# plugins needs network. Without dracula/tmux there is no status bar theme, and
# without vim-tmux-navigator there is no C-hjkl pane navigation — which the
# keybindings popup above advertises. This section provides both in pure tmux.
#
# It is defined BEFORE the TPM call below on purpose: plugins load last, so
# every option set here is overwritten when they are present. To keep that
# guarantee, only set options that dracula/tmux itself sets. It does NOT set
# status-justify, window-status-separator, status-position or status, so those
# must be left alone or they would leak through and change a themed machine.
# Colours mirror the values dracula actually produces.

set -g status-interval 5
set -g status-style "bg=#44475a,fg=#f8f8f2"
set -g status-left-length 100
set -g status-right-length 100

# Session | host, turning yellow while the prefix is held (as dracula does).
set -g status-left "#[bg=#50fa7b]#[fg=#282a36]#{?client_prefix,#[bg=#f1fa8c],} #S | #H "

# Uptime (green, like @dracula-uptime-colors) then load average, date, time.
set -g status-right "#[fg=#282a36]#[bg=#50fa7b] #(~/.config/tmux/scripts/sysinfo.sh uptime) #[fg=#f8f8f2]#[bg=#44475a] #(~/.config/tmux/scripts/sysinfo.sh load) #[fg=#6272a4]|#[fg=#f8f8f2] %a %b %d #[fg=#6272a4]|#[fg=#f8f8f2] %I:%M %p "

setw -g window-status-format "#[fg=#f8f8f2]#[bg=#44475a] #I #W"
setw -g window-status-current-format "#[fg=#f8f8f2]#[bg=#6272a4] #I #W "

set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9"
set -g message-style "bg=#44475a,fg=#f8f8f2"

# C-h/j/k/l/\ pane navigation. A bare `select-pane` would steal these keys from
# vim, so this replicates vim-tmux-navigator's check: when the pane is running
# vim/nvim/view/fzf, forward the key instead of switching panes. Snippet and
# pattern are the ones documented in vim-tmux-navigator's README, so behaviour
# matches the plugin.
#
# C-\ needs no escaping beyond the single quotes: tmux performs no replacements
# inside them, so 'C-\' is the literal key name (verified with
# `list-keys -T root 'C-\'`). The plugin's README doubles the backslash only
# because its snippet nests the binding inside an if-shell string, which this
# does not. Requires tmux >= 3.0 for that key name.
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\' 'select-pane -l'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# Guarded so a machine without TPM (e.g. a server installed without network
# access) starts cleanly instead of erroring. Falls back to Debian's packaged
# TPM at /usr/share/tmux-plugin-manager if present.
if-shell '[ -f ~/.config/tmux/plugins/tpm/tpm ]' \
  'run ~/.config/tmux/plugins/tpm/tpm' \
  'if-shell "[ -f /usr/share/tmux-plugin-manager/tpm ]" "run /usr/share/tmux-plugin-manager/tpm"'
